    <line x1="450" y1="130" x2="630" y2="250"/>
    <line x1="270" y1="250" x2="150" y2="390"/>
    <line x1="270" y1="250" x2="390" y2="390"/>
    <line x1="630" y1="250" x2="750" y2="390"/>
    <line x1="390" y1="390" x2="750" y2="390"/>
  </g>

  <g font-family="Arial" font-size="24" text-anchor="middle">
    <circle cx="450" cy="130" r="42" fill="white" stroke="#333" stroke-width="4"/>
